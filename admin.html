<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة - المتابعة</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; background-color: #f4f4f4; padding: 20px; color: #111; }
        .container { max-width: 1000px; margin: auto; }
        .card { background: #fff; padding: 25px; margin-bottom: 25px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-top: 4px solid #004d00; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 15px; margin-bottom: 20px; }
        h1, h3 { color: #004d00; margin-top: 0; }
        .btn { background-color: #004d00; color: #fff; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-left: 5px; }
        .btn:hover { background-color: #003300; }
        .btn-black { background-color: #111; }
        .btn-red { background-color: #b30000; }
        .btn-blue { background-color: #004080; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; margin-top: 5px; margin-bottom: 15px; box-sizing: border-box; }
        .flex-grid { display: flex; gap: 15px; }
        .flex-grid > div { flex: 1; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { background-color: #004d00; color: white; padding: 10px; text-align: right; }
        td { padding: 10px; border-bottom: 1px solid #eee; }
        
        /* تصميم نافذة المحادثة للإدارة */
        #admin-chat-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 400px; background: white; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 2000; flex-direction: column; overflow: hidden; border: 2px solid #004d00; }
        #admin-chat-header { background: #004d00; color: white; padding: 15px; font-weight: bold; display: flex; justify-content: space-between; }
        #admin-chat-close { cursor: pointer; color: white; font-weight: bold; background: none; border: none; font-size: 16px; }
        #admin-chat-messages { height: 350px; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; background: #fafafa; }
        .msg { padding: 10px; border-radius: 8px; max-width: 85%; font-size: 14px; }
        .msg.client { background: #e0e0e0; color: #111; align-self: flex-start; border-bottom-right-radius: 0; }
        .msg.admin { background: #004d00; color: white; align-self: flex-end; border-bottom-left-radius: 0; }
        #admin-chat-input-container { display: flex; border-top: 1px solid #ddd; }
        #admin-chat-input { flex: 1; padding: 10px; border: none; outline: none; }
        #admin-chat-send { background: #111; color: white; border: none; padding: 10px 15px; cursor: pointer; font-weight: bold; }
        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1999; }
    </style>
</head>
<body>

    <div id="overlay" onclick="closeChat()"></div>
    <div id="admin-chat-modal">
        <div id="admin-chat-header">
            <span id="chat-client-name">محادثة العميل</span>
            <button id="admin-chat-close" onclick="closeChat()">✖</button>
        </div>
        <div id="admin-chat-messages"></div>
        <div id="admin-chat-input-container">
            <input type="text" id="admin-chat-input" placeholder="اكتب ردك هنا...">
            <button id="admin-chat-send" onclick="sendAdminMessage()">إرسال</button>
        </div>
    </div>

    <div class="container">
        <div class="card header">
            <h1>لوحة الإدارة</h1>
            <button class="btn btn-black" onclick="logout()">تسجيل الخروج</button>
        </div>

        <div class="flex-grid">
            <div class="card">
                <h3>إضافة عميل جديد (يدوي)</h3>
                <div class="flex-grid">
                    <div><label>الاسم</label><input type="text" id="c-name"></div>
                    <div><label>السن</label><input type="number" id="c-age"></div>
                </div>
                <div class="flex-grid">
                    <div><label>النوع</label><select id="c-gender"><option value="ذكر">ذكر</option><option value="أنثى">أنثى</option></select></div>
                    <div><label>الهدف</label><input type="text" id="c-goal"></div>
                </div>
                <button class="btn" onclick="addClientManual()">حفظ العميل</button>
            </div>
            <div class="card">
                <h3>رفع بيانات (شيت إكسيل)</h3>
                <input type="file" id="excel-file" accept=".xlsx, .xls">
                <button class="btn btn-black" onclick="uploadExcel()">رفع البيانات</button>
            </div>
        </div>

        <div class="card">
            <h3>قائمة العملاء (لنسخ الروابط وإضافة المهام)</h3>
            <table>
                <thead><tr><th>الاسم</th><th>الهدف</th><th>الرابط المباشر</th><th>إجراءات</th></tr></thead>
                <tbody id="clients-body"></tbody>
            </table>
        </div>

        <div class="flex-grid">
            <div class="card">
                <h3>متابعة المهام</h3>
                <table>
                    <thead><tr><th>العميل</th><th>المهمة</th><th>الحالة</th><th>إجراءات</th></tr></thead>
                    <tbody id="tasks-body"></tbody>
                </table>
            </div>
            <div class="card">
                <h3>سجل الدخول</h3>
                <table>
                    <thead><tr><th>العميل</th><th>وقت الدخول</th></tr></thead>
                    <tbody id="logs-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://eknnzobkfiwcodlqrwhn.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVrbm56b2JrZml3Y29kbHFyd2huIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwNTU3ODIsImV4cCI6MjEwMzYzMTc4Mn0.bT_AzaWrTeDgltPO3a4O9h6i9oc-J5JrOGmXv5kYiys';
        const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let activeChatClientId = null;
        let adminChatInterval = null;

        window.onload = async () => {
            const { data: { user } } = await sbClient.auth.getUser();
            if (!user) window.location.href = 'index.html';
            refreshAll();
        };

        function refreshAll() { loadClients(); loadTasks(); loadLogs(); }

        async function logout() { await sbClient.auth.signOut(); window.location.href = 'index.html'; }

        async function addClientManual() {
            const name = document.getElementById('c-name').value;
            const age = document.getElementById('c-age').value;
            const gender = document.getElementById('c-gender').value;
            const goal = document.getElementById('c-goal').value;
            if (!name) return alert('اكتب اسم العميل!');
            await sbClient.from('client_records').insert([{ name, age, gender, goal }]);
            refreshAll();
        }

        async function loadClients() {
            const { data } = await sbClient.from('client_records').select('*').order('created_at', { ascending: false });
            const tbody = document.getElementById('clients-body');
            tbody.innerHTML = '';
            if(data) data.forEach(c => {
                tbody.innerHTML += `<tr>
                    <td>${c.name}</td><td>${c.goal}</td>
                    <td><button class="btn" style="padding: 5px 10px; font-size:12px;" onclick="copyLink('${c.access_token}')">نسخ</button></td>
                    <td>
                        <button class="btn btn-blue" style="padding: 5px 10px; font-size:12px;" onclick="openChat('${c.id}', '${c.name}')">💬 محادثة</button>
                        <button class="btn btn-black" style="padding: 5px 10px; font-size:12px;" onclick="askTask('${c.id}', '${c.name}')">+ مهمة</button>
                        <button class="btn" style="background-color: #555; padding: 5px 10px; font-size:12px;" onclick="resetDevice('${c.id}', '${c.name}')">فك الجهاز</button>
                        <button class="btn btn-red" style="padding: 5px 10px; font-size:12px;" onclick="deleteClient('${c.id}', '${c.name}')">حذف</button>
                    </td>
                </tr>`;
            });
        }

        // --- نظام الشات في الإدارة ---
        function openChat(id, name) {
            activeChatClientId = id;
            document.getElementById('chat-client-name').innerText = 'محادثة: ' + name;
            document.getElementById('overlay').style.display = 'block';
            document.getElementById('admin-chat-modal').style.display = 'flex';
            loadAdminMessages();
            adminChatInterval = setInterval(loadAdminMessages, 3000);
        }

        function closeChat() {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('admin-chat-modal').style.display = 'none';
            activeChatClientId = null;
            clearInterval(adminChatInterval);
        }

        async function loadAdminMessages() {
            if(!activeChatClientId) return;
            const { data } = await sbClient.from('messages').select('*').eq('client_id', activeChatClientId).order('created_at', { ascending: true });
            const box = document.getElementById('admin-chat-messages');
            box.innerHTML = '';
            if(data) {
                data.forEach(m => {
                    const msgClass = m.sender === 'admin' ? 'msg admin' : 'msg client';
                    box.innerHTML += `<div class="${msgClass}">${m.message}</div>`;
                });
                box.scrollTop = box.scrollHeight;
            }
        }

        async function sendAdminMessage() {
            const input = document.getElementById('admin-chat-input');
            const text = input.value.trim();
            if(!text || !activeChatClientId) return;
            
            input.value = '';
            await sbClient.from('messages').insert([{ client_id: activeChatClientId, sender: 'admin', message: text }]);
            loadAdminMessages();
        }

        document.getElementById('admin-chat-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendAdminMessage();
        });
        // ------------------------------

        async function deleteClient(id, name) {
            if(confirm(`هل أنت متأكد من حذف العميل؟`)) {
                await sbClient.from('access_logs').delete().eq('client_name', name);
                await sbClient.from('client_records').delete().eq('id', id);
                refreshAll();
            }
        }
        function copyLink(token) { navigator.clipboard.writeText(window.location.origin + '/client.html?token=' + token).then(() => alert('تم النسخ')); }
        async function askTask(id, name) {
            const desc = prompt(`اكتب المهمة للعميل (${name}):`);
            if (desc && desc.trim()) { await sbClient.from('tasks').insert([{ client_id: id, description: desc, status: 'pending' }]); loadTasks(); }
        }
        async function loadTasks() {
            const { data } = await sbClient.from('tasks').select('*, client_records(name)').order('created_at', { ascending: false });
            const tbody = document.getElementById('tasks-body');
            tbody.innerHTML = '';
            if(data) data.forEach(t => {
                const cName = t.client_records ? t.client_records.name : '-';
                const st = t.status === 'completed' ? '✅' : '⏳';
                tbody.innerHTML += `<tr><td>${cName}</td><td>${t.description}</td><td>${st}</td><td><button class="btn btn-red" style="padding: 5px 10px; font-size:12px;" onclick="deleteTask('${t.id}')">حذف</button></td></tr>`;
            });
        }
        async function deleteTask(id) { if(confirm('متأكد؟')) { await sbClient.from('tasks').delete().eq('id', id); loadTasks(); } }
        async function loadLogs() {
            const { data } = await sbClient.from('access_logs').select('*').order('accessed_at', { ascending: false }).limit(10);
            const tbody = document.getElementById('logs-body');
            tbody.innerHTML = '';
            if(data) data.forEach(l => tbody.innerHTML += `<tr><td>${l.client_name}</td><td dir="ltr" style="font-size:13px;">${new Date(l.accessed_at).toLocaleString('ar-EG')}</td></tr>`);
        }
        async function resetDevice(id, name) {
            if(confirm(`فك ارتباط جهاز (${name})؟`)) {
                await sbClient.from('client_records').update({ device_id: null }).eq('id', id);
                alert('تم فك الجهاز بنجاح!');
            }
        }
    </script>
</body>
</html>
