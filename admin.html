<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة - المتابعة</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; background-color: #f4f4f4; padding: 20px; color: #111; }
        .container { max-width: 900px; margin: auto; }
        .card { background: #fff; padding: 25px; margin-bottom: 25px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-top: 4px solid #004d00; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 15px; margin-bottom: 20px; }
        h1, h3 { color: #004d00; margin-top: 0; }
        .btn { background-color: #004d00; color: #fff; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn:hover { background-color: #003300; }
        .btn-black { background-color: #111; }
        .btn-black:hover { background-color: #333; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; margin-top: 5px; margin-bottom: 15px; box-sizing: border-box; }
        .flex-grid { display: flex; gap: 15px; }
        .flex-grid > div { flex: 1; }
    </style>
</head>
<body>

    <div class="container">
        <div class="card header">
            <h1>لوحة الإدارة</h1>
            <button class="btn btn-black" onclick="logout()">تسجيل الخروج</button>
        </div>

        <div class="card">
            <h3>إضافة عميل جديد (يدوي)</h3>
            <div class="flex-grid">
                <div>
                    <label>الاسم</label>
                    <input type="text" id="c-name" placeholder="اسم العميل">
                </div>
                <div>
                    <label>السن</label>
                    <input type="number" id="c-age" placeholder="السن">
                </div>
                <div>
                    <label>النوع</label>
                    <select id="c-gender">
                        <option value="ذكر">ذكر</option>
                        <option value="أنثى">أنثى</option>
                    </select>
                </div>
            </div>
            <label>الهدف</label>
            <input type="text" id="c-goal" placeholder="الهدف من المتابعة">
            <button class="btn" onclick="addClientManual()">حفظ العميل</button>
        </div>

        <div class="card">
            <h3>إضافة عملاء (شيت إكسيل)</h3>
            <p style="font-size: 14px; color: #555;">يجب أن يحتوي الشيت على الأعمدة التالية بالترتيب: الاسم، السن، النوع، الهدف.</p>
            <input type="file" id="excel-file" accept=".xlsx, .xls">
            <button class="btn btn-black" onclick="uploadExcel()">رفع البيانات</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://eknnzobkfiwcodlqrwhn.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVrbm56b2JrZml3Y29kbHFyd2huIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwNTU3ODIsImV4cCI6MjEwMzYzMTc4Mn0.bT_AzaWrTeDgltPO3a4O9h6i9oc-J5JrOGmXv5kYiys';
        const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.onload = async () => {
            const { data: { user } } = await sbClient.auth.getUser();
            if (!user) window.location.href = 'index.html';
        };

        async function logout() {
            await sbClient.auth.signOut();
            window.location.href = 'index.html';
        }

        async function addClientManual() {
            const name = document.getElementById('c-name').value;
            const age = document.getElementById('c-age').value;
            const gender = document.getElementById('c-gender').value;
            const goal = document.getElementById('c-goal').value;

            if (!name) { alert('برجاء كتابة اسم العميل'); return; }

            const { error } = await sbClient.from('client_records').insert([{ name, age, gender, goal }]);
            if (error) alert('حدث خطأ أثناء الحفظ');
            else {
                alert('تمت إضافة العميل بنجاح');
                document.getElementById('c-name').value = '';
                document.getElementById('c-age').value = '';
                document.getElementById('c-goal').value = '';
            }
        }

        function uploadExcel() {
            const fileInput = document.getElementById('excel-file');
            if (!fileInput.files.length) { alert('برجاء اختيار ملف إكسيل أولاً'); return; }

            const reader = new FileReader();
            reader.onload = async (e) => {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(firstSheet);

                const formattedData = jsonData.map(row => ({
                    name: row['الاسم'],
                    age: String(row['السن'] || ''),
                    gender: row['النوع'] || 'غير محدد',
                    goal: row['الهدف'] || ''
                })).filter(item => item.name);

                if (formattedData.length === 0) { alert('الملف فارغ أو لا يحتوي على عمود "الاسم"'); return; }

                const { error } = await sbClient.from('client_records').insert(formattedData);
                if (error) alert('حدث خطأ أثناء رفع بيانات الإكسيل');
                else alert(`تم رفع بيانات ${formattedData.length} عميل بنجاح`);
                
                fileInput.value = '';
            };
            reader.readAsArrayBuffer(fileInput.files[0]);
        }
    </script>
</body>
</html>
