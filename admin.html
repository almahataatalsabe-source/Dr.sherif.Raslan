<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة - المتابعة</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; background-color: #f4f4f4; padding: 20px; color: #111; }
        .container { max-width: 1100px; margin: auto; }
        .card { background: #fff; padding: 25px; margin-bottom: 25px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-top: 4px solid #004d00; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 15px; margin-bottom: 20px; }
        h1, h3 { color: #004d00; margin-top: 0; }
        .btn { background-color: #004d00; color: #fff; padding: 8px 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-left: 5px; }
        .btn-black { background-color: #111; }
        .btn-blue { background-color: #004080; position: relative;}
        /* إشعار العملاء في الإدارة */
        .notification-dot { position: absolute; top: -5px; right: -5px; background: #b30000; width: 12px; height: 12px; border-radius: 50%; display: none; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px;}
        th { background-color: #004d00; color: white; padding: 10px; text-align: right; }
        td { padding: 10px; border-bottom: 1px solid #eee; vertical-align: middle; }
        
        /* شريط التحكم في التقدم */
        .progress-control { display: flex; align-items: center; gap: 5px; }
        .progress-control input[type="range"] { width: 80px; accent-color: #004d00; }
        .progress-control span { font-weight: bold; width: 35px; text-align: center;}
        
        /* شات الإدارة مع زر الـ AI */
        #admin-chat-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 450px; background: white; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 2000; flex-direction: column; overflow: hidden; border: 2px solid #004d00; }
        #admin-chat-header { background: #004d00; color: white; padding: 15px; font-weight: bold; display: flex; justify-content: space-between; align-items: center;}
        #admin-chat-close { cursor: pointer; color: white; background: none; border: none; font-size: 20px; }
        #admin-chat-messages { height: 350px; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; background: #fafafa; }
        .msg { padding: 10px; border-radius: 8px; max-width: 85%; font-size: 14px; }
        .msg.client { background: #e0e0e0; color: #111; align-self: flex-start; border-bottom-right-radius: 0; }
        .msg.admin { background: #004d00; color: white; align-self: flex-end; border-bottom-left-radius: 0; }
        #ai-suggest-btn { background: #e6f2e6; color: #004d00; border: 1px solid #004d00; padding: 8px; text-align: center; font-weight: bold; cursor: pointer; font-size: 13px; }
        #ai-suggest-btn:hover { background: #d0ebd0; }
        #admin-chat-input-container { display: flex; border-top: 1px solid #ddd; }
        #admin-chat-input { flex: 1; padding: 10px; border: none; outline: none; }
        #admin-chat-send { background: #111; color: white; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; }
        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1999; }
    </style>
</head>
<body>

    <!-- ملف التنبيه للإدارة -->
    <audio id="admin-notify-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

    <div id="overlay" onclick="closeChat()"></div>
    <div id="admin-chat-modal">
        <div id="admin-chat-header">
            <span id="chat-client-name">محادثة العميل</span>
            <button id="admin-chat-close" onclick="closeChat()">✖</button>
        </div>
        <div id="admin-chat-messages"></div>
        <div id="ai-suggest-btn" onclick="generateAIResponse()">✨ توليد رسالة تشجيعية بالـ AI بناءً على نسبة التقدم</div>
        <div id="admin-chat-input-container">
            <input type="text" id="admin-chat-input" placeholder="اكتب ردك هنا...">
            <button id="admin-chat-send" onclick="sendAdminMessage()">إرسال</button>
        </div>
    </div>

    <div class="container">
        <div class="card header">
            <h1>لوحة الإدارة</h1>
            <button class="btn btn-black" onclick="logout()">تسجيل الخروج</button>
        </div>

        <div class="card">
            <h3>قائمة العملاء ومؤشر الالتزام</h3>
            <table>
                <thead><tr><th>الاسم</th><th>الهدف</th><th>مؤشر الالتزام</th><th>إجراءات التواصل والمهام</th></tr></thead>
                <tbody id="clients-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://eknnzobkfiwcodlqrwhn.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVrbm56b2JrZml3Y29kbHFyd2huIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwNTU3ODIsImV4cCI6MjEwMzYzMTc4Mn0.bT_AzaWrTeDgltPO3a4O9h6i9oc-J5JrOGmXv5kYiys';
        const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let activeChatClientId = null;
        let activeChatClientProgress = 0;
        let activeChatClientName = '';
        let clientsMessageCounts = {};

        window.onload = async () => {
            const { data: { user } } = await sbClient.auth.getUser();
            if (!user) window.location.href = 'index.html';
            loadClients();
            setInterval(checkAllMessages, 5000); // فحص مستمر للرسايل
        };

        async function loadClients() {
            const { data } = await sbClient.from('client_records').select('*').order('created_at', { ascending: false });
            const tbody = document.getElementById('clients-body');
            tbody.innerHTML = '';
            if(data) data.forEach(c => {
                const prog = c.progress || 0;
                if(clientsMessageCounts[c.id] === undefined) clientsMessageCounts[c.id] = 0;
                
                tbody.innerHTML += `<tr id="client-row-${c.id}">
                    <td><strong>${c.name}</strong></td>
                    <td>${c.goal}</td>
                    <td>
                        <div class="progress-control">
                            <input type="range" min="0" max="100" value="${prog}" onchange="updateProgress('${c.id}', this.value)" oninput="this.nextElementSibling.innerText=this.value+'%'">
                            <span>${prog}%</span>
                        </div>
                    </td>
                    <td>
                        <button class="btn btn-blue" onclick="openChat('${c.id}', '${c.name}', ${prog})">
                            💬 محادثة <div class="notification-dot" id="dot-${c.id}"></div>
                        </button>
                        <button class="btn btn-black" onclick="askTask('${c.id}', '${c.name}')">+ مهمة</button>
                        <button class="btn" style="background-color: #555;" onclick="copyLink('${c.access_token}')">رابط</button>
                    </td>
                </tr>`;
            });
        }

        async function updateProgress(id, val) {
            await sbClient.from('client_records').update({ progress: parseInt(val) }).eq('id', id);
        }

        // --- نظام الإشعارات الخلفية للإدارة ---
        async function checkAllMessages() {
            const { data } = await sbClient.from('messages').select('client_id, id');
            if(!data) return;
            
            let playSound = false;
            let counts = {};
            data.forEach(m => counts[m.client_id] = (counts[m.client_id] || 0) + 1);
            
            for (let cId in counts) {
                if (clientsMessageCounts[cId] !== undefined && counts[cId] > clientsMessageCounts[cId]) {
                    playSound = true;
                    if (activeChatClientId !== cId) {
                        const dot = document.getElementById(`dot-${cId}`);
                        if(dot) dot.style.display = 'block';
                    } else {
                        loadAdminMessages(); // لو الشات مفتوح، حدثه
                    }
                }
                clientsMessageCounts[cId] = counts[cId];
            }
            if(playSound) document.getElementById('admin-notify-sound').play().catch(e=>{});
        }

        // --- نظام الشات وتوليد الـ AI ---
        function openChat(id, name, prog) {
            activeChatClientId = id;
            activeChatClientName = name;
            activeChatClientProgress = prog;
            document.getElementById('chat-client-name').innerText = 'محادثة: ' + name;
            document.getElementById('overlay').style.display = 'block';
            document.getElementById('admin-chat-modal').style.display = 'flex';
            
            const dot = document.getElementById(`dot-${id}`);
            if(dot) dot.style.display = 'none';
            
            loadAdminMessages();
        }

        function closeChat() {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('admin-chat-modal').style.display = 'none';
            activeChatClientId = null;
        }

        async function loadAdminMessages() {
            if(!activeChatClientId) return;
            const { data } = await sbClient.from('messages').select('*').eq('client_id', activeChatClientId).order('created_at', { ascending: true });
            const box = document.getElementById('admin-chat-messages');
            box.innerHTML = '';
            if(data) {
                clientsMessageCounts[activeChatClientId] = data.length;
                data.forEach(m => {
                    const msgClass = m.sender === 'admin' ? 'msg admin' : 'msg client';
                    box.innerHTML += `<div class="${msgClass}">${m.message}</div>`;
                });
                box.scrollTop = box.scrollHeight;
            }
        }

        async function sendAdminMessage() {
            const input = document.getElementById('admin-chat-input');
            const text = input.value.trim();
            if(!text || !activeChatClientId) return;
            input.value = '';
            await sbClient.from('messages').insert([{ client_id: activeChatClientId, sender: 'admin', message: text }]);
            loadAdminMessages();
        }

        document.getElementById('admin-chat-input').addEventListener('keypress', e => { if(e.key === 'Enter') sendAdminMessage(); });

        // --- المساعد الذكي لتوليد الردود (AI Local Logic) ---
        function generateAIResponse() {
            const prog = activeChatClientProgress;
            const name = activeChatClientName;
            const prompts = {
                low: [
                    `أهلاً يا ${name}، البدايات دايماً بتحتاج مجهود، أنا معاك خطوة بخطوة لحد ما نوصل لهدفك! 🎯`,
                    `عاش يا ${name} على اللي فات، بس محتاجين نزود التزامنا شوية الأيام الجاية عشان نشوف نتيجة أسرع! 💪`
                ],
                mid: [
                    `ما شاء الله يا ${name}، إنت ماشي على التراك الصح ووصلت لـ ${prog}% التزام، كمل وماتوقفش! 🔥`,
                    `مبسوط جداً بتقدمك يا ${name}، النص الصعب عدى، خليك مركز في اللي جاي عشان النتيجة قربت تظهر 👏`
                ],
                high: [
                    `أداء مبهر يا ${name}! نسبة التزامك ${prog}% دي مش أي حد بيوصلها، فخور بيك جداً 👑`,
                    `بطل كالعادة يا ${name}، الاستمرارية دي هي اللي بتصنع الفرق الحقيقي، استمر على نفس القوة! 🚀`
                ]
            };

            let selectedArray = prog < 40 ? prompts.low : (prog < 80 ? prompts.mid : prompts.high);
            let randomMsg = selectedArray[Math.floor(Math.random() * selectedArray.length)];
            
            document.getElementById('admin-chat-input').value = randomMsg;
            document.getElementById('admin-chat-input').focus();
        }
        
        function copyLink(token) { navigator.clipboard.writeText(window.location.origin + '/client.html?token=' + token).then(()=>alert('تم النسخ')); }
        async function askTask(id, name) { const desc = prompt(`اكتب المهمة للعميل (${name}):`); if(desc) { await sbClient.from('tasks').insert([{ client_id:id, description:desc, status:'pending'}]); alert('تمت إضافة المهمة');} }
        async function logout() { await sbClient.auth.signOut(); window.location.href = 'index.html'; }
    </script>
</body>
</html>
