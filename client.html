<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متابعة المهام اليومية</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; color: #111; }
        .container { background: white; max-width: 600px; margin: 40px auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-top: 5px solid #004d00; text-align: center; }
        h2 { color: #004d00; margin-bottom: 5px; }
        h4 { color: #555; margin-top: 0; margin-bottom: 25px; }
        
        /* شريط التقدم والـ AI */
        .progress-box { background: #fafafa; border: 1px solid #ddd; padding: 20px; border-radius: 10px; margin-bottom: 25px; }
        .progress-bar-container { background: #e0e0e0; border-radius: 20px; height: 25px; width: 100%; overflow: hidden; margin: 15px 0; position: relative; }
        .progress-fill { background: #004d00; height: 100%; width: 0%; transition: width 1s ease-in-out; }
        .progress-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-weight: bold; font-size: 14px; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
        .ai-message { font-size: 15px; font-weight: bold; color: #004d00; margin-top: 10px; padding: 10px; background: #e6f2e6; border-radius: 8px; border-right: 4px solid #004d00; text-align: right;}
        
        .task-card { background: #f9f9f9; border: 1px solid #ddd; padding: 15px; border-radius: 8px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; text-align: right; }
        .btn-complete { background-color: #004d00; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .completed { opacity: 0.6; text-decoration: line-through; }
        .btn-done { background-color: #777; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: default; }
        
        /* تصميم الشات والإشعارات */
        #chat-widget { position: fixed; bottom: 20px; left: 20px; width: 300px; background: white; border-radius: 10px; box-shadow: 0 5px 20px rgba(0,0,0,0.2); border: 1px solid #ddd; display: none; flex-direction: column; overflow: hidden; z-index: 1000; }
        #chat-header { background: #111; color: white; padding: 15px; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; }
        #chat-messages { height: 300px; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; background: #fafafa; }
        .msg { padding: 10px; border-radius: 8px; max-width: 85%; font-size: 14px; }
        .msg.client { background: #004d00; color: white; align-self: flex-start; border-bottom-right-radius: 0; }
        .msg.admin { background: #e0e0e0; color: #111; align-self: flex-end; border-bottom-left-radius: 0; }
        #chat-input-container { display: flex; border-top: 1px solid #ddd; }
        #chat-input { flex: 1; padding: 10px; border: none; outline: none; }
        #chat-send { background: #004d00; color: white; border: none; padding: 10px 15px; cursor: pointer; font-weight: bold; }
        
        #chat-toggle-btn { position: fixed; bottom: 20px; left: 20px; background: #111; color: white; border: none; border-radius: 50px; padding: 15px 25px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); z-index: 999; position: relative;}
        /* نقطة الإشعار الحمراء */
        .notification-badge { position: absolute; top: -5px; right: -5px; background: #b30000; color: white; font-size: 12px; font-weight: bold; width: 20px; height: 20px; border-radius: 50%; display: none; align-items: center; justify-content: center; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div class="container">
        <h2>المهام المطلوبة منك</h2>
        <h4 id="client-name">جاري التعرف على بياناتك...</h4>
        
        <div class="progress-box" id="progress-box" style="display:none;">
            <h3 style="margin-top:0; color:#111;">مؤشر الالتزام والتقدم 🚀</h3>
            <div class="progress-bar-container">
                <div class="progress-fill" id="progress-fill"></div>
                <div class="progress-text" id="progress-text">0%</div>
            </div>
            <div class="ai-message" id="ai-message">✨ جاري تحليل أدائك...</div>
        </div>

        <div id="tasks-container"><p>جاري تحميل المهام...</p></div>
    </div>

    <!-- زر فتح الشات -->
    <div style="position: fixed; bottom: 20px; left: 20px; z-index: 999;">
        <button id="chat-toggle-btn" onclick="toggleChat()" style="display:none;">
            💬 تواصل مع الدكتور
            <span class="notification-badge" id="chat-badge">!</span>
        </button>
    </div>

    <!-- نافذة الشات -->
    <div id="chat-widget">
        <div id="chat-header" onclick="toggleChat()"><span>تواصل مع الدكتور</span><span>▼</span></div>
        <div id="chat-messages"></div>
        <div id="chat-input-container">
            <input type="text" id="chat-input" placeholder="اكتب رسالتك هنا...">
            <button id="chat-send" onclick="sendMessage()">إرسال</button>
        </div>
    </div>

    <!-- ملف صوت الإشعار -->
    <audio id="notification-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

    <script>
        const SUPABASE_URL = 'https://eknnzobkfiwcodlqrwhn.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVrbm56b2JrZml3Y29kbHFyd2huIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwNTU3ODIsImV4cCI6MjEwMzYzMTc4Mn0.bT_AzaWrTeDgltPO3a4O9h6i9oc-J5JrOGmXv5kYiys';
        const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let currentClientId = null;
        let chatInterval = null;
        let lastMessageCount = 0;

        window.onload = async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            if (!token) return;

            const { data: client } = await sbClient.from('client_records').select('*').eq('access_token', token).single();
            if (!client) return;

            currentClientId = client.id;
            document.getElementById('client-name').innerText = `أهلاً بك يا ${client.name}`;
            document.getElementById('chat-toggle-btn').style.display = 'block';
            
            // تحديث شريط التقدم والـ AI
            document.getElementById('progress-box').style.display = 'block';
            const progress = client.progress || 0;
            document.getElementById('progress-fill').style.width = progress + '%';
            document.getElementById('progress-text').innerText = progress + '%';
            document.getElementById('ai-message').innerText = getAIMessage(progress);

            loadClientTasks();
            setInterval(checkNewMessages, 3000); // فحص الرسايل في الخلفية
        };

        function getAIMessage(prog) {
            if (prog === 0) return '✨ البداية دايماً هي أهم خطوة، يلا نبدأ رحلة التغيير!';
            if (prog < 30) return '✨ خطوة بخطوة بنقرب للهدف، استمر في الالتزام متكسلش!';
            if (prog < 70) return '✨ عاش جداً! إنت في نص الطريق وماشي على التراك الصح، كمل يا بطل 👏';
            if (prog < 100) return '✨ أداء مبهر! النتيجة بقت قريبة جداً، استمر على نفس القوة 🔥';
            return '✨ إنجاز عظيم! وصلت لقمة الالتزام، فخورين بيك جداً 👑';
        }

        async function loadClientTasks() {
            const container = document.getElementById('tasks-container');
            const { data: tasks } = await sbClient.from('tasks').select('*').eq('client_id', currentClientId).order('created_at', { ascending: false });
            if (!tasks || tasks.length === 0) { container.innerHTML = '<p>لا توجد مهام مطلوبة منك حالياً.</p>'; return; }
            container.innerHTML = '';
            tasks.forEach(task => {
                const isCompleted = task.status === 'completed';
                const btnHtml = isCompleted ? `<button class="btn-done">مكتملة ✅</button>` : `<button class="btn-complete" onclick="markCompleted('${task.id}')">إتمام المهمة</button>`;
                container.innerHTML += `<div class="task-card"><div class="${isCompleted ? 'completed' : ''}">${task.description}</div><div>${btnHtml}</div></div>`;
            });
        }

        async function markCompleted(taskId) {
            await sbClient.from('tasks').update({ status: 'completed' }).eq('id', taskId);
            loadClientTasks(); 
        }

        // --- نظام الشات والإشعارات ---
        async function checkNewMessages() {
            if(!currentClientId) return;
            const { data } = await sbClient.from('messages').select('id').eq('client_id', currentClientId);
            if (data && data.length > lastMessageCount) {
                lastMessageCount = data.length;
                if (document.getElementById('chat-widget').style.display !== 'flex') {
                    document.getElementById('chat-badge').style.display = 'flex';
                    document.getElementById('notification-sound').play().catch(e => console.log('Auto-play prevented'));
                } else {
                    loadMessages();
                }
            }
        }

        function toggleChat() {
            const widget = document.getElementById('chat-widget');
            if (widget.style.display === 'none' || widget.style.display === '') {
                widget.style.display = 'flex';
                document.getElementById('chat-badge').style.display = 'none';
                loadMessages();
            } else {
                widget.style.display = 'none';
            }
        }

        async function loadMessages() {
            const { data } = await sbClient.from('messages').select('*').eq('client_id', currentClientId).order('created_at', { ascending: true });
            const box = document.getElementById('chat-messages');
            box.innerHTML = '';
            if(data) {
                lastMessageCount = data.length;
                data.forEach(m => {
                    const msgClass = m.sender === 'client' ? 'msg client' : 'msg admin';
                    box.innerHTML += `<div class="${msgClass}">${m.message}</div>`;
                });
                box.scrollTop = box.scrollHeight;
            }
        }

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if(!text) return;
            input.value = '';
            await sbClient.from('messages').insert([{ client_id: currentClientId, sender: 'client', message: text }]);
            loadMessages();
        }

        document.getElementById('chat-input').addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });
    </script>
</body>
</html>
